database:
  migrateOnStartup: true
  
ingress:
  enabled: true
  className: #{ProjectTemplate.Ingress.ClassName}
  annotations: {
     }
  hosts:
    - host: #{ProjectTemplate.Host.Name}
      paths:
        - path: /api/audits
          pathType: Prefix
        
service:
  type: ClusterIP
  port: 10000
  
image:
  repository: #{Octopus.Action.Package[ProjectTemplate.Helm.Container.Image].PackageId}
  tag: #{Octopus.Action.Package[ProjectTemplate.Helm.Container.Image].PackageVersion} 