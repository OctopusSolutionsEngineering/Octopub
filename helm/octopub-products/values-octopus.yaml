database:
  migrateOnStartup: true

ingress:
  enabled: true
  className: #{Project.Ingress.ClassName}
  annotations: {
     }
  hosts:
    - host: #{Project.Host.Name}
      paths:
        - path: /api/products
          pathType: Prefix
          
service:
  type: ClusterIP
  port: 8083
          
image:
  repository: #{Octopus.Action.[Deploy a Helm Chart].Package[ProjectTemplate.Helm.Container.Image].PackageId}
  tag: #{Octopus.Action[Deploy a Helm Chart].Package[ProjectTemplate.Helm.Container.Image].PackageVersion} 